name: CI

on:
  push:
    branches: ["master"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Coalesce updates to one PR; pushes/dispatches each keep their own run.
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Select checks and validate documentation
    runs-on: ubuntu-latest
    outputs:
      core: ${{ steps.select.outputs.core }}
      desktop: ${{ steps.select.outputs.desktop }}
      packages: ${{ steps.select.outputs.packages }}
      maintenance: ${{ steps.select.outputs.maintenance }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify change selection and documentation
        run: |
          node --test scripts/ci-changes.test.mjs
          node scripts/check-docs.mjs
          git diff --check
      - id: select
        name: Select affected checks
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/ci-changes.mjs "$BASE" HEAD

  desktop:
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    name: Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config libwebkit2gtk-4.1-dev \
            libxdo-dev libssl-dev libayatana-appindicator3-dev \
            librsvg2-dev libwayland-dev

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Match Tauri's Mac build environment for every Cargo invocation
        if: runner.os == 'macOS'
        run: node scripts/build-context.mjs >> "$GITHUB_ENV"

      - name: Cache prototype Cargo build
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: desktop/src-tauri -> target
          key: desktop-${{ runner.os }}
          env-vars: CARGO CC CFLAGS CXX CMAKE RUST MACOSX_DEPLOYMENT_TARGET

      - name: Cache package CLI dependencies
        if: needs.changes.outputs.packages == 'true' && runner.os != 'Linux'
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: . -> target/desktop-sidecar
          key: desktop-sidecar-${{ runner.os }}
          env-vars: CARGO CC CFLAGS CXX CMAKE RUST MACOSX_DEPLOYMENT_TARGET

      - name: Install frontend dependencies
        run: npm ci

      - name: Check and build frontend
        shell: bash
        run: |
          npm run build
          node scripts/frontend-proof.mjs --record

      - name: Platform-sensitive tooling tests
        run: npm run test:tooling

      - name: Frontend interaction tests
        if: runner.os == 'Linux'
        run: npm run test:ui

      - name: Format desktop Rust
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Lint desktop Rust
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Desktop Rust tests
        if: runner.os == 'Linux'
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

      - name: Installed-feature Rust checks without release credentials
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-features --all-targets -- -D warnings

      - name: Bounded updater and framework handoff tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --all-features

      - name: Test-only signed Windows installer, never installed
        if: runner.os == 'Windows' && needs.changes.outputs.packages == 'true'
        run: npm run test:package
        env:
          SSH_CLIPBOARD_PREBUILT_FRONTEND: '1'
          SSH_CLIPBOARD_CLI_TARGET_DIR: ${{ github.workspace }}/target/desktop-sidecar

      - name: Test-only release Mac app, inspect archive without installing
        if: runner.os == 'macOS' && needs.changes.outputs.packages == 'true'
        run: npm run test:package -- --release
        env:
          SSH_CLIPBOARD_PREBUILT_FRONTEND: '1'
          SSH_CLIPBOARD_CLI_TARGET_DIR: ${{ github.workspace }}/target/desktop-sidecar

      - name: Retain disposable Mac package and inspection evidence
        if: success() && runner.os == 'macOS' && needs.changes.outputs.packages == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-test-package
          path: desktop/artifacts/TEST-only-installed-*/
          if-no-files-found: error
          retention-days: 7

      - name: Build standalone prototype
        run: npm run build:prototype
        env:
          SSH_CLIPBOARD_PREBUILT_FRONTEND: '1'

  test:
    needs: changes
    if: needs.changes.outputs.core == 'true'
    name: Test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
          - name: mac
            os: macos-latest
          - name: linux-server
            os: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          key: core-${{ matrix.name }}

      - name: Format
        run: cargo fmt -- --check

      - name: Guard headless dependency graph
        shell: bash
        run: |
          tree="$(cargo tree --locked --edges normal --prefix none --format '{p}')"
          if printf '%s\n' "$tree" | grep -E '^(arboard|tao|tray-icon|global-hotkey|gtk|gdk|x11rb|x11-dl|wayland-client|libappindicator|notify-rust|winreg|auto-launch|single-instance|tracing-appender|winrt-notification|confy|wincode) '; then
            exit 1
          fi

      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked
      - name: Build (release)
        run: cargo build --locked --release

  browser:
    name: Browser panel contracts
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - name: Install the lockfile-matched Chromium browser
        run: npx playwright install --with-deps chromium
      - name: Keyboard, layout and native form validation contracts
        run: npm run test:browser
      - name: Retain browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-failure-diagnostics
          path: |
            desktop/artifacts/browser-results/
            desktop/artifacts/browser-report/
          if-no-files-found: ignore
          retention-days: 7

  maintenance:
    name: Disposable server maintenance
    needs: changes
    if: needs.changes.outputs.maintenance == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          key: server-maintenance
          workspaces: |
            . -> target/linux-maintenance-smoke
            . -> target/server-package
      - run: npm --prefix desktop ci
      - name: Synthetic signed staging and wrong-key rejection
        run: npm --prefix desktop run test:server-package
      - name: Real daemon/proxy install, update, rollback and journal recovery
        run: npm --prefix desktop run test:server-maintenance

  complete:
    name: CI complete
    if: always()
    needs: [changes, desktop, test, maintenance, browser]
    runs-on: ubuntu-latest
    steps:
      - name: Require successful selection and every selected check
        env:
          CHANGES: ${{ needs.changes.result }}
          CORE_SELECTED: ${{ needs.changes.outputs.core }}
          DESKTOP_SELECTED: ${{ needs.changes.outputs.desktop }}
          CORE: ${{ needs.test.result }}
          DESKTOP: ${{ needs.desktop.result }}
          MAINTENANCE_SELECTED: ${{ needs.changes.outputs.maintenance }}
          MAINTENANCE: ${{ needs.maintenance.result }}
          BROWSER: ${{ needs.browser.result }}
        run: |
          test "$CHANGES" = success
          if [ "$CORE_SELECTED" = true ]; then test "$CORE" = success; fi
          if [ "$DESKTOP_SELECTED" = true ]; then test "$DESKTOP" = success; test "$BROWSER" = success; fi
          if [ "$MAINTENANCE_SELECTED" = true ]; then test "$MAINTENANCE" = success; fi
