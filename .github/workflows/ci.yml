name: CI

on:
  push:
    branches: ["master"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Select checks and validate documentation
    runs-on: ubuntu-latest
    outputs:
      core: ${{ steps.select.outputs.core }}
      desktop: ${{ steps.select.outputs.desktop }}
      packages: ${{ steps.select.outputs.packages }}
      maintenance: ${{ steps.select.outputs.maintenance }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify change selection and documentation
        run: |
          node --test scripts/ci-changes.test.mjs
          node scripts/check-docs.mjs
          git diff --check
      - id: select
        name: Select affected checks
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/ci-changes.mjs "$BASE" HEAD

  desktop:
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    name: Desktop prototype (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config libwebkit2gtk-4.1-dev \
            libxdo-dev libssl-dev libayatana-appindicator3-dev \
            librsvg2-dev libwayland-dev

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache prototype Cargo build
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: desktop/src-tauri -> target
          key: desktop-${{ runner.os }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Check and build frontend
        run: npm run build

      - name: Platform-sensitive tooling tests
        run: npm run test:tooling

      - name: Frontend interaction tests
        if: runner.os == 'Linux'
        run: npm run test:ui

      - name: Format desktop Rust
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Lint desktop Rust
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Desktop Rust tests
        if: runner.os == 'Linux'
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

      - name: Installed-feature Rust checks without release credentials
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-features --all-targets -- -D warnings

      - name: Bounded updater and framework handoff tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --all-features

      - name: Test-only signed Windows installer, never installed
        if: runner.os == 'Windows' && needs.changes.outputs.packages == 'true'
        run: npm run test:package

      - name: Test-only release Mac app, inspect archive without installing
        if: runner.os == 'macOS' && needs.changes.outputs.packages == 'true'
        run: npm run test:package -- --release

      - name: Retain disposable Mac package and inspection evidence
        if: success() && runner.os == 'macOS' && needs.changes.outputs.packages == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-test-package
          path: desktop/artifacts/TEST-only-installed-*/
          if-no-files-found: error
          retention-days: 7

      - name: Build standalone prototype
        run: npm run build:prototype

  test:
    needs: changes
    if: needs.changes.outputs.core == 'true'
    name: Test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-agent
            os: windows-latest
            features: "agent"
          - name: mac-agent
            os: macos-latest
            features: "agent"
          - name: linux-agent
            os: ubuntu-latest
            features: "agent"
          - name: linux-server
            os: ubuntu-latest
            features: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux GUI deps (agent)
        if: runner.os == 'Linux' && matrix.features == 'agent'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libglib2.0-dev \
            libgtk-3-dev \
            libappindicator3-dev \
            libdbus-1-dev \
            libxdo-dev \
            libx11-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev \
            libxfixes-dev \
            libxcb1-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          key: core-${{ matrix.name }}

      - name: Format
        run: cargo fmt -- --check

      - name: Guard headless dependency graph
        if: matrix.features != 'agent'
        shell: bash
        run: |
          tree="$(cargo tree --locked --no-default-features --edges normal --prefix none --format '{p}')"
          if printf '%s\n' "$tree" | grep -E '^(arboard|tao|tray-icon|global-hotkey|gtk|gdk|x11rb|x11-dl|wayland-client|libappindicator|notify-rust|winreg) '; then
            exit 1
          fi

      - name: Default clipboard CLI without the retired agent
        if: matrix.features == 'agent'
        shell: bash
        run: |
          tree="$(cargo tree --locked --edges normal --prefix none --format '{p}')"
          if printf '%s\n' "$tree" | grep -E '^(tao|tray-icon|global-hotkey|auto-launch|single-instance|tracing-appender|notify-rust|winrt-notification|winreg) '; then
            exit 1
          fi
          cargo test --locked --test default_cli

      - name: Clippy
        run: |
          if [ "${{ matrix.features }}" = "agent" ]; then
            cargo clippy --locked --features agent --all-targets -- -D warnings
          else
            cargo clippy --locked --no-default-features --all-targets -- -D warnings
          fi
        shell: bash

      - name: Test
        run: |
          if [ "${{ matrix.features }}" = "agent" ]; then
            cargo test --locked --features agent
          else
            cargo test --locked --no-default-features
          fi
        shell: bash

      - name: Build (release)
        run: |
          if [ "${{ matrix.features }}" = "agent" ]; then
            cargo build --locked --release --features agent
          else
            cargo build --locked --release --no-default-features
          fi
        shell: bash

      - name: Released-client compatibility guards and real binary probe
        if: matrix.name == 'linux-server'
        timeout-minutes: 3
        run: |
          python3 -m unittest discover -s scripts -p test_released_compatibility.py -v
          python3 scripts/released_compatibility.py --current-binary target/release/ssh_clipboard --evidence-file "$RUNNER_TEMP/released-compatibility.json"

      - name: Retain released-client compatibility evidence
        if: always() && matrix.name == 'linux-server'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: released-v0.3.0-compatibility
          path: ${{ runner.temp }}/released-compatibility.json
          if-no-files-found: ignore
          retention-days: 14

  maintenance:
    name: Disposable server maintenance
    needs: changes
    if: needs.changes.outputs.maintenance == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          key: server-maintenance
          workspaces: |
            . -> target/linux-maintenance-smoke
            . -> target/server-package
      - run: npm --prefix desktop ci
      - name: Synthetic signed staging and wrong-key rejection
        run: npm --prefix desktop run test:server-package
      - name: Real daemon/proxy install, update, rollback and journal recovery
        run: npm --prefix desktop run test:server-maintenance

  complete:
    name: CI complete
    if: always()
    needs: [changes, desktop, test, maintenance]
    runs-on: ubuntu-latest
    steps:
      - name: Require successful selection and every selected check
        env:
          CHANGES: ${{ needs.changes.result }}
          CORE_SELECTED: ${{ needs.changes.outputs.core }}
          DESKTOP_SELECTED: ${{ needs.changes.outputs.desktop }}
          CORE: ${{ needs.test.result }}
          DESKTOP: ${{ needs.desktop.result }}
          MAINTENANCE_SELECTED: ${{ needs.changes.outputs.maintenance }}
          MAINTENANCE: ${{ needs.maintenance.result }}
        run: |
          test "$CHANGES" = success
          if [ "$CORE_SELECTED" = true ]; then test "$CORE" = success; fi
          if [ "$DESKTOP_SELECTED" = true ]; then test "$DESKTOP" = success; fi
          if [ "$MAINTENANCE_SELECTED" = true ]; then test "$MAINTENANCE" = success; fi
