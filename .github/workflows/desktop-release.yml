name: Stage signed desktop release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable version already committed in the core Cargo.toml
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: desktop-release
  cancel-in-progress: false

jobs:
  validate:
    if: github.ref == 'refs/heads/master'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    env:
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, resolved 2026-10-14
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Validate immutable source and requested version
        shell: pwsh
        run: |
          if ($env:RELEASE_VERSION -notmatch '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') { throw 'Invalid stable version' }
          $core = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          if ($core -ne $env:RELEASE_VERSION -or $core -eq '0.0.0') { throw 'Version must match the reviewed core commit' }
          if ((git rev-parse HEAD) -ne $env:GITHUB_SHA) { throw 'Unexpected source commit' }
          node desktop/scripts/release-notes.mjs $env:RELEASE_VERSION
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Pin Rust toolchain
        run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt,clippy
      - name: Validate core
        shell: pwsh
        run: |
          cargo +1.99.0 fmt -- --check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo +1.99.0 clippy --locked --all-targets -- -D warnings
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo +1.99.0 test --locked
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Validate desktop without release credentials
        working-directory: desktop
        shell: pwsh
        run: |
          npm ci
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm test
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run build
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo +1.99.0 fmt --manifest-path src-tauri/Cargo.toml -- --check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo +1.99.0 clippy --locked --manifest-path src-tauri/Cargo.toml --all-features --all-targets -- -D warnings
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo +1.99.0 test --locked --manifest-path src-tauri/Cargo.toml --all-features
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

  package:
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x86_64
          - os: macos-latest
            platform: darwin-aarch64
    # Configure required reviewers and master-only deployment rules before first use.
    environment: desktop-release
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_PLATFORM: ${{ matrix.platform }}
      RUSTUP_TOOLCHAIN: '1.99.0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Prepare trusted build tools without signing credentials
        shell: pwsh
        run: |
          rustup toolchain install 1.99.0 --profile minimal
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm --prefix desktop ci
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Build, sign, and verify exact package
        working-directory: desktop
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.DESKTOP_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.DESKTOP_SIGNING_PASSWORD }}
          DESKTOP_PUBLIC_KEY: ${{ vars.DESKTOP_UPDATE_PUBLIC_KEY }}
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY -or -not $env:DESKTOP_PUBLIC_KEY) { throw 'Protected release trust inputs are missing' }
          $publicKey = Join-Path $env:RUNNER_TEMP 'desktop-public-key.pub'
          Set-Content -LiteralPath $publicKey -Value $env:DESKTOP_PUBLIC_KEY -NoNewline
          node scripts/build-installed.mjs --version $env:RELEASE_VERSION --public-key-file $publicKey
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          @'
          import {readFileSync,readdirSync} from 'node:fs';
          import path from 'node:path';
          const stages=readdirSync('artifacts').filter(name=>name.startsWith(`installed-${process.env.RELEASE_VERSION}-`));
          if(stages.length!==1)throw Error('Expected exactly one package stage');
          const proof=JSON.parse(readFileSync(path.join('artifacts',stages[0],'build-evidence.json'),'utf8'));
          if(proof.platform!==process.env.RELEASE_PLATFORM)throw Error('Native runner architecture differs from requested platform');
          '@ | node --input-type=module
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-package-${{ matrix.platform }}
          path: desktop/artifacts/installed-*/
          if-no-files-found: error

  draft:
    needs: package
    runs-on: windows-latest
    permissions:
      contents: write
      actions: read
    env:
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Download verified packages from this exact workflow run
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download $env:GITHUB_RUN_ID --repo $env:GITHUB_REPOSITORY --pattern 'desktop-package-*' --dir desktop/artifacts/release-inputs
      - name: Create reviewable draft, never publish or overwrite
        env:
          GH_TOKEN: ${{ github.token }}
        run: node desktop/scripts/desktop-draft.mjs
