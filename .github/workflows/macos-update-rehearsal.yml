name: Prepare disposable Mac updater rehearsal

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/macos-update-rehearsal.yml'
      - 'desktop/scripts/prepare-macos-updater.mjs'
      - 'desktop/src-tauri/src/configuration.rs'

permissions:
  contents: read

jobs:
  prepare:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Prepare tools without release credentials
        run: |
          rustup toolchain install 1.99.0 --profile minimal
          npm --prefix desktop ci
      - name: Build and independently verify two disposable Mac packages
        env:
          RUSTUP_TOOLCHAIN: '1.99.0'
        run: node desktop/scripts/prepare-macos-updater.mjs
      - name: Retain public packages after private-key removal
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: macos-updater-rehearsal
          path: |
            desktop/artifacts/TEST-only-installed-*/
            desktop/artifacts/macos-update-rehearsal.json
          if-no-files-found: error
          retention-days: 7
