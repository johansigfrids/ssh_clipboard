[package]
name = "ssh_clipboard_desktop_prototype"
version = "0.0.0"
edition = "2024"
publish = false
default-run = "ssh_clipboard_desktop_prototype"

[[bin]]
name = "verify_desktop_update"
path = "src/bin/verify_desktop_update.rs"
required-features = ["release-tools"]

# Keep the prototype dependency graph and lockfile separate until Phase 2.
[workspace]

[features]
custom-protocol = ["tauri/custom-protocol"]
# Enabled by the future installer build, never by timestamped portable prototypes.
installed-desktop = ["dep:tauri-plugin-updater", "dep:tauri-plugin-autostart", "dep:reqwest", "dep:rustls"]
release-tools = []

[dependencies]
ssh_clipboard = { path = "../..", default-features = false, features = ["external-resource-owner"] }
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-notification = "2"
tauri-plugin-updater = { version = "2", optional = true }
tauri-plugin-autostart = { version = "2", optional = true }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["sync", "time"] }
arboard = { version = "3", features = ["wayland-data-control"] }
image = { version = "0.25", default-features = false, features = ["png"] }
base64 = "0.22"
eyre = "0.6"
uuid = { version = "1", features = ["v4", "serde"] }
minisign-verify = "0.3"
semver = "1"
url = "2"
serde_json = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "stream"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring"], optional = true }

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
serde_json = "1"
tauri = { version = "2", features = ["test"] }
