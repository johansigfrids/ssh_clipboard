# Original comments must survive in the backup.
config_version = 1
target = "legacy-hub"
port = 2222
identity_file = "keys/path with spaces"
ssh_options = ["BatchMode=no", "ServerAliveInterval=20"]
max_size = 123456
timeout_ms = 9000
resync_frames = false
resync_max_bytes = 2048
autostart_enabled = true

[hotkeys]
push = "CmdOrCtrl+Alt+KeyC"
pull = "CmdOrCtrl+Alt+KeyV"
